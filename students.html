<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Students · Homework Manager</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" />
          </svg>
        </div>
        <span class="sidebar-title">Homework Manager</span>
      </div>
      <nav class="sidebar-nav">
        <a href="classes.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
          Classes
        </a>
        <a href="students.html" class="active">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
          Students
        </a>
        <a href="assignments.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
          Assignments
        </a>
        <a href="settings.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6" /><circle cx="9" cy="6" r="2" /><line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="2" /><line x1="4" y1="18" x2="20" y2="18" /><circle cx="7" cy="18" r="2" /></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar" id="sidebarInitials">?</span>
          <span class="sidebar-user-name" id="sidebarUsername"></span>
        </div>
        <button class="btn btn-icon" id="logoutBtn" title="Log out" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-main-inner">
        <div class="page-header">
          <div>
            <h1>Students</h1>
            <p class="page-subtitle">Every student's login details, in one place.</p>
          </div>
        </div>

        <div class="field" style="max-width: 360px;">
          <input id="searchInput" placeholder="Search by name or username…" autocomplete="off" />
        </div>

        <div id="studentsContainer"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireTeacherAuth, initSidebar } from "./js/auth.js";
    import { watchStudents, watchClasses, ensureStudentCredentials, deleteStudent } from "./js/db.js";
    import { escapeHtml, initials } from "./js/helpers.js";

    requireTeacherAuth();
    initSidebar();

    let students = [];
    let classes = [];
    let searchTerm = "";

    function classNames(student) {
      return (student.classIds || [])
        .map((id) => classes.find((c) => c.id === id)?.name)
        .filter(Boolean);
    }

    function matchesSearch(s) {
      if (!searchTerm) return true;
      const haystack = `${s.name} ${s.username || ""}`.toLowerCase();
      return haystack.includes(searchTerm);
    }

    function render() {
      const container = document.getElementById("studentsContainer");
      const sorted = [...students].sort((a, b) => a.name.localeCompare(b.name));
      const filtered = sorted.filter(matchesSearch);

      if (students.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon-badge icon-badge-muted">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
            </div>
            No students yet. Add students from a class first.
          </div>`;
        return;
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon-badge icon-badge-muted">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
            </div>
            No students match "${escapeHtml(searchTerm)}".
          </div>`;
        return;
      }

      container.innerHTML = `<ul class="roster-list">
        ${filtered
          .map((s) => {
            const names = classNames(s);
            return `
            <li>
              <span class="roster-person">
                <span class="avatar">${initials(s.name)}</span>
                <span>
                  ${escapeHtml(s.name)}
                  <div style="margin-top:4px; display:flex; gap:6px; flex-wrap:wrap;">
                    ${
                      names.length
                        ? names.map((n) => `<span class="badge">${escapeHtml(n)}</span>`).join("")
                        : `<span class="badge">No class</span>`
                    }
                  </div>
                </span>
              </span>
              <span class="roster-actions">
                ${
                  s.username
                    ? `<span class="credential-chip" title="Student login">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2" /><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" /></svg>
                        ${escapeHtml(s.username)} · ${escapeHtml(s.password)}
                      </span>`
                    : `<button class="btn btn-secondary" data-gen-creds="${s.id}" data-gen-name="${escapeHtml(s.name)}" type="button">
                        Generate login
                      </button>`
                }
                <button class="btn btn-danger-ghost" data-delete="${s.id}" data-name="${escapeHtml(s.name)}" type="button">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>
                  Delete
                </button>
              </span>
            </li>`;
          })
          .join("")}
      </ul>`;

      container.querySelectorAll("[data-gen-creds]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await ensureStudentCredentials(btn.dataset.genCreds, btn.dataset.genName, students);
        });
      });

      container.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm(`Remove ${btn.dataset.name} entirely? They'll lose access and be removed from all classes.`)) return;
          await deleteStudent(btn.dataset.delete);
        });
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchTerm = e.target.value.trim().toLowerCase();
      render();
    });

    watchStudents((data) => {
      students = data;
      render();
    });
    watchClasses((data) => {
      classes = data;
      render();
    });
  </script>
</body>
</html>
