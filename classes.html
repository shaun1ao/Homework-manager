<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Classes · Homework Manager</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" />
          </svg>
        </div>
        <span class="sidebar-title">Homework Manager</span>
      </div>
      <nav class="sidebar-nav">
        <a href="classes.html" class="active">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
          Classes
        </a>
        <a href="assignments.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
          Assignments
        </a>
        <a href="settings.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6" /><circle cx="9" cy="6" r="2" /><line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="2" /><line x1="4" y1="18" x2="20" y2="18" /><circle cx="7" cy="18" r="2" /></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar" id="sidebarInitials">?</span>
          <span class="sidebar-user-name" id="sidebarUsername"></span>
        </div>
        <button class="btn btn-icon" id="logoutBtn" title="Log out" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-main-inner">
        <div class="page-header">
          <div>
            <h1>Classes</h1>
            <p class="page-subtitle">Create classes and manage who's in them.</p>
          </div>
        </div>

        <form class="inline-form" id="createClassForm">
          <input id="newClassName" placeholder="New class name (e.g. Period 3 - Algebra)" required />
          <button class="btn btn-primary" type="submit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
            Add class
          </button>
        </form>

        <div id="classesContainer"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, initSidebar } from "./js/auth.js";
    import { watchClasses, watchStudents, createClass, deleteClass } from "./js/db.js";
    import { escapeHtml } from "./js/helpers.js";

    requireAuth();
    initSidebar();

    let classes = [];
    let students = [];

    function studentCount(classId) {
      return students.filter((s) => (s.classIds || []).includes(classId)).length;
    }

    function render() {
      const container = document.getElementById("classesContainer");

      if (classes.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon-badge icon-badge-muted">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2-3h14l2 3" /><path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7" /><path d="M3 7h18" /><path d="M9 7v3a3 3 0 0 0 6 0V7" /></svg>
            </div>
            No classes yet. Create one above.
          </div>`;
        return;
      }

      container.innerHTML = `<div class="card-grid">${classes
        .map((c) => {
          const count = studentCount(c.id);
          return `
          <a href="class.html?id=${encodeURIComponent(c.id)}" class="card class-card" data-id="${c.id}">
            <div class="card-top">
              <div class="icon-badge">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
              </div>
            </div>
            <div class="card-title">${escapeHtml(c.name)}</div>
            <div class="card-meta">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
              ${count} student${count === 1 ? "" : "s"}
            </div>
            <button class="btn btn-danger-ghost" data-delete="${c.id}" data-name="${escapeHtml(c.name)}" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>
              Delete
            </button>
          </a>`;
        })
        .join("")}</div>`;

      container.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.dataset.delete;
          const name = btn.dataset.name;
          if (!confirm(`Delete class "${name}"? This does not delete the students themselves.`)) return;
          await deleteClass(id);
        });
      });
    }

    watchClasses((data) => {
      classes = data;
      render();
    });
    watchStudents((data) => {
      students = data;
      render();
    });

    document.getElementById("createClassForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("newClassName");
      const name = input.value.trim();
      if (!name) return;
      input.disabled = true;
      await createClass(name);
      input.value = "";
      input.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
