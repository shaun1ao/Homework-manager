<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Settings · Homework Manager</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" />
          </svg>
        </div>
        <span class="sidebar-title">Homework Manager</span>
      </div>
      <nav class="sidebar-nav">
        <a href="classes.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
          Classes
        </a>
        <a href="students.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
          Students
        </a>
        <a href="assignments.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
          Assignments
        </a>
        <a href="settings.html" class="active">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6" /><circle cx="9" cy="6" r="2" /><line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="2" /><line x1="4" y1="18" x2="20" y2="18" /><circle cx="7" cy="18" r="2" /></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar" id="sidebarInitials">?</span>
          <span class="sidebar-user-name" id="sidebarUsername"></span>
        </div>
        <button class="btn btn-icon" id="logoutBtn" title="Log out" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-main-inner">
        <div class="page-header">
          <div>
            <h1>Settings</h1>
            <p class="page-subtitle">Update your sign-in credentials.</p>
          </div>
        </div>

        <form class="panel-form panel-form-narrow" id="settingsForm">
          <label class="field">
            <span>Username</span>
            <input id="usernameInput" required />
          </label>

          <label class="field">
            <span>New password</span>
            <input id="passwordInput" type="password" placeholder="Leave blank to keep current password" />
          </label>

          <label class="field">
            <span>Confirm new password</span>
            <input id="confirmPasswordInput" type="password" />
          </label>

          <div class="error-text" id="errorBox" hidden></div>
          <div class="success-text" id="successBox" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2" /><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" /></svg>
            Saved.
          </div>

          <button class="btn btn-primary" type="submit">Save changes</button>
        </form>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireTeacherAuth, initSidebar, currentUsername, changeCredentials } from "./js/auth.js";

    requireTeacherAuth();
    initSidebar();

    document.getElementById("usernameInput").value = currentUsername();

    const form = document.getElementById("settingsForm");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      successBox.hidden = true;

      const username = document.getElementById("usernameInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const confirmPassword = document.getElementById("confirmPasswordInput").value;

      if (!username) {
        errorBox.textContent = "Username can't be empty.";
        errorBox.hidden = false;
        return;
      }
      if (password && password !== confirmPassword) {
        errorBox.textContent = "Passwords don't match.";
        errorBox.hidden = false;
        return;
      }

      const updates = { username };
      if (password) updates.password = password;

      await changeCredentials(updates);
      document.getElementById("passwordInput").value = "";
      document.getElementById("confirmPasswordInput").value = "";
      successBox.hidden = false;
    });
  </script>
</body>
</html>
