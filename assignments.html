<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Assignments · Homework Manager</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" />
          </svg>
        </div>
        <span class="sidebar-title">Homework Manager</span>
      </div>
      <nav class="sidebar-nav">
        <a href="classes.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
          Classes
        </a>
        <a href="students.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
          Students
        </a>
        <a href="assignments.html" class="active">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
          Assignments
        </a>
        <a href="settings.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6" /><circle cx="9" cy="6" r="2" /><line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="2" /><line x1="4" y1="18" x2="20" y2="18" /><circle cx="7" cy="18" r="2" /></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar" id="sidebarInitials">?</span>
          <span class="sidebar-user-name" id="sidebarUsername"></span>
        </div>
        <button class="btn btn-icon" id="logoutBtn" title="Log out" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-main-inner">
        <div class="page-header">
          <div>
            <h1>Assignments</h1>
            <p class="page-subtitle">Give work to a class, or to specific people.</p>
          </div>
          <button class="btn btn-primary" id="toggleFormBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
            <span id="toggleFormBtnText">New assignment</span>
          </button>
        </div>

        <form class="panel-form" id="assignmentForm" hidden>
          <label class="field">
            <span>Title</span>
            <input id="titleInput" required />
          </label>

          <label class="field">
            <span>Due date</span>
            <input id="dueDateInput" type="date" required />
          </label>

          <label class="field">
            <span>Extra info (instructions, details, etc.)</span>
            <textarea id="descriptionInput" rows="4"></textarea>
          </label>

          <div class="field">
            <span>Assign to</span>
            <div class="radio-row">
              <label>
                <input type="radio" name="targetType" value="class" checked />
                A whole class
              </label>
              <label>
                <input type="radio" name="targetType" value="students" />
                Specific people
              </label>
            </div>
          </div>

          <label class="field" id="classPickerField">
            <span>Class</span>
            <select id="classPicker">
              <option value="">Select a class…</option>
            </select>
          </label>

          <div class="field" id="studentsPickerField" hidden>
            <span id="studentsPickerLabel">People (0 selected)</span>
            <div class="checkbox-list" id="studentsCheckboxList"></div>
          </div>

          <button class="btn btn-primary" type="submit" id="assignBtn">Assign</button>
        </form>

        <div id="assignmentsContainer"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireTeacherAuth, initSidebar } from "./js/auth.js";
    import { watchAssignments, watchClasses, watchStudents, createAssignment } from "./js/db.js";
    import { escapeHtml, isOverdue } from "./js/helpers.js";

    requireTeacherAuth();
    initSidebar();

    let assignments = [];
    let classes = [];
    let students = [];
    let selectedStudentIds = [];

    function targetBadge(a) {
      if (a.targetType === "class") {
        const c = classes.find((c) => c.id === a.classId);
        return `<span class="badge badge-class">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
          ${c ? escapeHtml(c.name) : "Class (deleted)"}
        </span>`;
      }
      const names = (a.studentIds || []).map((id) => students.find((s) => s.id === id)?.name).filter(Boolean);
      return `<span class="badge badge-students">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
        ${names.length ? escapeHtml(names.join(", ")) : "No one"}
      </span>`;
    }

    function renderAssignmentsList() {
      const container = document.getElementById("assignmentsContainer");
      if (assignments.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon-badge icon-badge-muted">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2-3h14l2 3" /><path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7" /><path d="M3 7h18" /><path d="M9 7v3a3 3 0 0 0 6 0V7" /></svg>
            </div>
            No assignments yet.
          </div>`;
        return;
      }

      container.innerHTML = `<ul class="assignment-list">
        ${assignments
          .map((a) => {
            const overdue = isOverdue(a.dueDate);
            return `
            <li>
              <a href="assignment.html?id=${encodeURIComponent(a.id)}">
                <div class="assignment-main">
                  <div class="assignment-row">
                    <span class="assignment-title">${escapeHtml(a.title)}</span>
                    <span class="assignment-due${overdue ? " overdue" : ""}">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="8" y1="3" x2="8" y2="7" /><line x1="16" y1="3" x2="16" y2="7" /></svg>
                      ${overdue ? "Overdue · " : "Due "}${escapeHtml(a.dueDate)}
                    </span>
                  </div>
                  <div class="assignment-target">${targetBadge(a)}</div>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-faint)"><path d="M9 6l6 6-6 6" /></svg>
              </a>
            </li>`;
          })
          .join("")}
      </ul>`;
    }

    function renderClassPicker() {
      const select = document.getElementById("classPicker");
      select.innerHTML =
        `<option value="">Select a class…</option>` +
        classes.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    }

    function renderStudentsPicker() {
      const list = document.getElementById("studentsCheckboxList");
      const label = document.getElementById("studentsPickerLabel");
      label.textContent = `People (${selectedStudentIds.length} selected)`;

      if (students.length === 0) {
        list.outerHTML = `<div class="empty-state" id="studentsCheckboxList">
          <div class="icon-badge icon-badge-muted">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2-3h14l2 3" /><path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7" /><path d="M3 7h18" /><path d="M9 7v3a3 3 0 0 0 6 0V7" /></svg>
          </div>
          No students yet. Add students from a class first.
        </div>`;
        return;
      }

      list.innerHTML = students
        .map(
          (s) => `
        <label>
          <input type="checkbox" value="${s.id}" ${selectedStudentIds.includes(s.id) ? "checked" : ""} />
          ${escapeHtml(s.name)}
        </label>`
        )
        .join("");

      list.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
        cb.addEventListener("change", () => {
          if (cb.checked) {
            selectedStudentIds.push(cb.value);
          } else {
            selectedStudentIds = selectedStudentIds.filter((id) => id !== cb.value);
          }
          renderStudentsPicker();
        });
      });
    }

    watchAssignments((data) => {
      assignments = data;
      renderAssignmentsList();
    });
    watchClasses((data) => {
      classes = data;
      renderAssignmentsList();
      renderClassPicker();
    });
    watchStudents((data) => {
      students = data;
      renderAssignmentsList();
      renderStudentsPicker();
    });

    const form = document.getElementById("assignmentForm");
    const toggleBtn = document.getElementById("toggleFormBtn");
    const toggleBtnText = document.getElementById("toggleFormBtnText");

    toggleBtn.addEventListener("click", () => {
      form.hidden = !form.hidden;
      toggleBtnText.textContent = form.hidden ? "New assignment" : "Cancel";
    });

    document.querySelectorAll('input[name="targetType"]').forEach((radio) => {
      radio.addEventListener("change", () => {
        const isClass = document.querySelector('input[name="targetType"]:checked').value === "class";
        document.getElementById("classPickerField").hidden = !isClass;
        document.getElementById("studentsPickerField").hidden = isClass;
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("titleInput").value.trim();
      const dueDate = document.getElementById("dueDateInput").value;
      const description = document.getElementById("descriptionInput").value.trim();
      const targetType = document.querySelector('input[name="targetType"]:checked').value;
      const classId = document.getElementById("classPicker").value;

      if (!title || !dueDate) return;
      if (targetType === "class" && !classId) return;
      if (targetType === "students" && selectedStudentIds.length === 0) return;

      const assignBtn = document.getElementById("assignBtn");
      assignBtn.disabled = true;
      assignBtn.textContent = "Saving…";

      await createAssignment({
        title,
        description,
        dueDate,
        targetType,
        classId: targetType === "class" ? classId : null,
        studentIds: targetType === "students" ? selectedStudentIds : [],
      });

      form.reset();
      selectedStudentIds = [];
      renderStudentsPicker();
      document.getElementById("classPickerField").hidden = false;
      document.getElementById("studentsPickerField").hidden = true;
      form.hidden = true;
      toggleBtnText.textContent = "New assignment";
      assignBtn.disabled = false;
      assignBtn.textContent = "Assign";
    });
  </script>
</body>
</html>
