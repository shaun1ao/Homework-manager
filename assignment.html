<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Assignment · Homework Manager</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" />
          </svg>
        </div>
        <span class="sidebar-title">Homework Manager</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar" id="sidebarInitials">?</span>
          <span class="sidebar-user-name" id="sidebarUsername"></span>
        </div>
        <button class="btn btn-icon" id="logoutBtn" title="Log out" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-main-inner" id="pageContent">
        <p class="empty-state">Loading…</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAnyAuth, initSidebar, currentRole, currentStudentId } from "./js/auth.js";
    import {
      watchAssignment,
      watchClasses,
      watchStudents,
      deleteAssignment,
      markAssignmentComplete,
      markAssignmentIncomplete,
    } from "./js/db.js";
    import { escapeHtml, getParam, isOverdue, initials } from "./js/helpers.js";

    requireAnyAuth();
    initSidebar();

    const role = currentRole();
    const myId = currentStudentId();
    const backHref = role === "student" ? "student.html" : "assignments.html";

    document.getElementById("sidebarNav").innerHTML =
      role === "student"
        ? `<a href="student.html" class="active">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
            My Assignments
          </a>`
        : `<a href="classes.html">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
            Classes
          </a>
          <a href="students.html">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
            Students
          </a>
          <a href="assignments.html" class="active">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
            Assignments
          </a>
          <a href="settings.html">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6" /><circle cx="9" cy="6" r="2" /><line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="2" /><line x1="4" y1="18" x2="20" y2="18" /><circle cx="7" cy="18" r="2" /></svg>
            Settings
          </a>`;

    const assignmentId = getParam("id");
    if (!assignmentId) window.location.href = backHref;

    let assignment;
    let classes = [];
    let students = [];

    function render() {
      const content = document.getElementById("pageContent");

      if (assignment === undefined) {
        content.innerHTML = `<p class="empty-state">Loading…</p>`;
        return;
      }

      if (assignment === null) {
        content.innerHTML = `
          <button class="back-link" id="backLink">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l7-7M5 12l7 7" /></svg>
            Back to assignments
          </button>
          <p class="empty-state">This assignment no longer exists.</p>`;
        document.getElementById("backLink").addEventListener("click", () => (window.location.href = backHref));
        return;
      }

      const targetClass = assignment.targetType === "class" ? classes.find((c) => c.id === assignment.classId) : null;
      const targetStudents =
        assignment.targetType === "students"
          ? (assignment.studentIds || []).map((id) => students.find((s) => s.id === id)).filter(Boolean)
          : [];
      const overdue = isOverdue(assignment.dueDate);
      const completedBy = assignment.completedBy || [];
      const iAmDone = role === "student" && completedBy.includes(myId);

      const eligibleStudents =
        assignment.targetType === "class"
          ? students.filter((s) => (s.classIds || []).includes(assignment.classId))
          : targetStudents;

      content.innerHTML = `
        <button class="back-link" id="backLink">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l7-7M5 12l7 7" /></svg>
          Back to ${role === "student" ? "my assignments" : "assignments"}
        </button>

        <div class="detail-card">
          <div class="detail-header">
            <div class="icon-badge">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
            </div>
            <h1>${escapeHtml(assignment.title)}</h1>
            ${
              role === "teacher"
                ? `<button class="btn btn-danger-ghost" id="deleteBtn" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>
                    Delete
                  </button>`
                : `<button class="btn ${iAmDone ? "btn-secondary" : "btn-primary"}" id="completeBtn" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.5 2.5L16 9" /></svg>
                    ${iAmDone ? "Completed" : "Mark as done"}
                  </button>`
            }
          </div>

          <div class="detail-row">
            <span class="detail-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="8" y1="3" x2="8" y2="7" /><line x1="16" y1="3" x2="16" y2="7" /></svg>
              Due date
            </span>
            <span class="detail-value">
              ${escapeHtml(assignment.dueDate)}
              ${
                overdue
                  ? `<span class="badge badge-danger" style="margin-left:8px">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><line x1="12" y1="7.75" x2="12" y2="13" /><line x1="12" y1="16.25" x2="12" y2="16.35" /></svg>
                      Overdue
                    </span>`
                  : ""
              }
            </span>
          </div>

          <div class="detail-row">
            <span class="detail-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
              Assigned to
            </span>
            <span class="detail-value">
              ${
                assignment.targetType === "class"
                  ? targetClass
                    ? `Class: ${escapeHtml(targetClass.name)}`
                    : "Class (deleted)"
                  : targetStudents.length
                  ? escapeHtml(targetStudents.map((s) => s.name).join(", "))
                  : "No one"
              }
            </span>
          </div>

          ${
            role === "teacher" && eligibleStudents.length > 0
              ? `<div class="detail-row detail-row-block">
                  <span class="detail-label">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.5 2.5L16 9" /></svg>
                    Completed (${completedBy.length}/${eligibleStudents.length})
                  </span>
                  <ul class="roster-list" style="width:100%">
                    ${eligibleStudents
                      .map((s) => {
                        const done = completedBy.includes(s.id);
                        return `
                        <li>
                          <span class="roster-person">
                            <span class="avatar">${initials(s.name)}</span>
                            ${escapeHtml(s.name)}
                          </span>
                          <span class="badge ${done ? "badge-success" : ""}">
                            ${done ? "Done" : "Not yet"}
                          </span>
                        </li>`;
                      })
                      .join("")}
                  </ul>
                </div>`
              : ""
          }

          ${
            assignment.description
              ? `<div class="detail-row detail-row-block">
                  <span class="detail-label">Extra info</span>
                  <p class="detail-description">${escapeHtml(assignment.description)}</p>
                </div>`
              : ""
          }
        </div>`;

      document.getElementById("backLink").addEventListener("click", () => (window.location.href = backHref));
      const deleteBtn = document.getElementById("deleteBtn");
      if (deleteBtn) {
        deleteBtn.addEventListener("click", async () => {
          if (!confirm("Delete this assignment?")) return;
          await deleteAssignment(assignmentId);
          window.location.href = backHref;
        });
      }
      const completeBtn = document.getElementById("completeBtn");
      if (completeBtn) {
        completeBtn.addEventListener("click", async () => {
          completeBtn.disabled = true;
          if (iAmDone) {
            await markAssignmentIncomplete(assignmentId, myId);
          } else {
            await markAssignmentComplete(assignmentId, myId);
          }
        });
      }
    }

    watchAssignment(assignmentId, (data) => {
      assignment = data;
      render();
    });
    watchClasses((data) => {
      classes = data;
      render();
    });
    watchStudents((data) => {
      students = data;
      render();
    });
  </script>
</body>
</html>
