<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>My Assignments · Homework Manager</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" />
          </svg>
        </div>
        <span class="sidebar-title">Homework Manager</span>
      </div>
      <nav class="sidebar-nav">
        <a href="student.html" class="active">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
          My Assignments
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar" id="sidebarInitials">?</span>
          <span class="sidebar-user-name" id="sidebarUsername"></span>
        </div>
        <button class="btn btn-icon" id="logoutBtn" title="Log out" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-main-inner">
        <div class="page-header">
          <div>
            <h1 id="pageTitle">My Assignments</h1>
            <p class="page-subtitle">Homework assigned to you and your classes.</p>
          </div>
        </div>

        <div id="assignmentsContainer"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireStudentAuth, initSidebar, currentStudentId } from "./js/auth.js";
    import {
      watchAssignments,
      watchClasses,
      watchStudents,
      markAssignmentComplete,
      markAssignmentIncomplete,
    } from "./js/db.js";
    import { escapeHtml, isOverdue, sortByDueDate } from "./js/helpers.js";

    requireStudentAuth();
    initSidebar();

    const myId = currentStudentId();

    let assignments = [];
    let classes = [];
    let students = [];

    function myClassIds() {
      const me = students.find((s) => s.id === myId);
      return me ? me.classIds || [] : [];
    }

    function targetBadge(a) {
      if (a.targetType === "class") {
        const c = classes.find((c) => c.id === a.classId);
        return `<span class="badge badge-class">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
          ${c ? escapeHtml(c.name) : "Class"}
        </span>`;
      }
      return `<span class="badge badge-students">Assigned to you</span>`;
    }

    function render() {
      const container = document.getElementById("assignmentsContainer");
      const myClasses = myClassIds();

      const mine = sortByDueDate(
        assignments.filter((a) => {
          if (a.targetType === "class") return myClasses.includes(a.classId);
          if (a.targetType === "students") return (a.studentIds || []).includes(myId);
          return false;
        })
      );

      const me = students.find((s) => s.id === myId);
      document.getElementById("pageTitle").textContent = me ? `Hi, ${me.name}` : "My Assignments";

      if (mine.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon-badge icon-badge-muted">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2-3h14l2 3" /><path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7" /><path d="M3 7h18" /><path d="M9 7v3a3 3 0 0 0 6 0V7" /></svg>
            </div>
            No assignments yet.
          </div>`;
        return;
      }

      container.innerHTML = `<ul class="assignment-list">
        ${mine
          .map((a) => {
            const overdue = isOverdue(a.dueDate);
            const done = (a.completedBy || []).includes(myId);
            return `
            <li class="${done ? "completed" : ""}">
              <label class="assignment-checkbox" title="${done ? "Mark as not done" : "Mark as done"}">
                <input type="checkbox" data-toggle-complete="${a.id}" ${done ? "checked" : ""} />
              </label>
              <a href="assignment.html?id=${encodeURIComponent(a.id)}">
                <div class="assignment-main">
                  <div class="assignment-row">
                    <span class="assignment-title">${escapeHtml(a.title)}</span>
                    <span class="assignment-due${done ? " done" : overdue ? " overdue" : ""}">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="8" y1="3" x2="8" y2="7" /><line x1="16" y1="3" x2="16" y2="7" /></svg>
                      ${done ? "Done · " : overdue ? "Overdue · " : "Due "}${escapeHtml(a.dueDate)}
                    </span>
                  </div>
                  <div class="assignment-target">${targetBadge(a)}</div>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-faint)"><path d="M9 6l6 6-6 6" /></svg>
              </a>
            </li>`;
          })
          .join("")}
      </ul>`;

      container.querySelectorAll("[data-toggle-complete]").forEach((cb) => {
        cb.addEventListener("click", (e) => e.stopPropagation());
        cb.addEventListener("change", async () => {
          const id = cb.dataset.toggleComplete;
          cb.disabled = true;
          if (cb.checked) {
            await markAssignmentComplete(id, myId);
          } else {
            await markAssignmentIncomplete(id, myId);
          }
        });
      });
    }

    watchAssignments((data) => {
      assignments = data;
      render();
    });
    watchClasses((data) => {
      classes = data;
      render();
    });
    watchStudents((data) => {
      students = data;
      render();
    });
  </script>
</body>
</html>
