<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Class · Homework Manager</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" />
          </svg>
        </div>
        <span class="sidebar-title">Homework Manager</span>
      </div>
      <nav class="sidebar-nav">
        <a href="classes.html" class="active">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /><path d="M22 8v6" /></svg>
          Classes
        </a>
        <a href="students.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><circle cx="17.5" cy="8.5" r="2.25" /><path d="M15.7 12.8c2.2.5 4 2.3 4.3 4.7" /></svg>
          Students
        </a>
        <a href="assignments.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2" /><rect x="9" y="2.25" width="6" height="3.5" rx="1" /><line x1="9" y1="10.5" x2="15" y2="10.5" /><line x1="9" y1="14.5" x2="15" y2="14.5" /></svg>
          Assignments
        </a>
        <a href="settings.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6" /><circle cx="9" cy="6" r="2" /><line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="2" /><line x1="4" y1="18" x2="20" y2="18" /><circle cx="7" cy="18" r="2" /></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar" id="sidebarInitials">?</span>
          <span class="sidebar-user-name" id="sidebarUsername"></span>
        </div>
        <button class="btn btn-icon" id="logoutBtn" title="Log out" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-main-inner" id="pageContent">
        <p class="empty-state">Loading…</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireTeacherAuth, initSidebar } from "./js/auth.js";
    import {
      watchClasses,
      watchStudents,
      watchAssignments,
      createStudent,
      addStudentToClass,
      removeStudentFromClass,
      ensureStudentCredentials,
    } from "./js/db.js";
    import { escapeHtml, initials, getParam, sortByDueDate } from "./js/helpers.js";

    requireTeacherAuth();
    initSidebar();

    const classId = getParam("id");
    if (!classId) window.location.href = "classes.html";

    let classes = [];
    let students = [];
    let assignments = [];

    function render() {
      const content = document.getElementById("pageContent");
      const klass = classes.find((c) => c.id === classId);

      if (!klass) {
        content.innerHTML = `
          <button class="back-link" id="backLink">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l7-7M5 12l7 7" /></svg>
            Back to classes
          </button>
          <p class="empty-state">Loading…</p>`;
        document.getElementById("backLink").addEventListener("click", () => (window.location.href = "classes.html"));
        return;
      }

      const roster = students.filter((s) => (s.classIds || []).includes(classId));
      const notInClass = students.filter((s) => !(s.classIds || []).includes(classId));
      const classAssignments = sortByDueDate(
        assignments.filter((a) => a.targetType === "class" && a.classId === classId)
      );

      content.innerHTML = `
        <button class="back-link" id="backLink">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l7-7M5 12l7 7" /></svg>
          Back to classes
        </button>
        <div class="page-header"><h1>${escapeHtml(klass.name)}</h1></div>

        <section class="section">
          <h2>Roster (${roster.length})</h2>
          ${
            roster.length === 0
              ? `<div class="empty-state">
                  <div class="icon-badge icon-badge-muted">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2-3h14l2 3" /><path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7" /><path d="M3 7h18" /><path d="M9 7v3a3 3 0 0 0 6 0V7" /></svg>
                  </div>
                  No students in this class yet.
                </div>`
              : `<ul class="roster-list">
                  ${roster
                    .map(
                      (s) => `
                    <li>
                      <span class="roster-person">
                        <span class="avatar">${initials(s.name)}</span>
                        ${escapeHtml(s.name)}
                      </span>
                      <span class="roster-actions">
                        ${
                          s.username
                            ? `<span class="credential-chip" title="Student login">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2" /><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" /></svg>
                                ${escapeHtml(s.username)} · ${escapeHtml(s.password)}
                              </span>`
                            : `<button class="btn btn-secondary" data-gen-creds="${s.id}" data-gen-name="${escapeHtml(s.name)}" type="button">
                                Generate login
                              </button>`
                        }
                        <button class="btn btn-danger-ghost" data-remove="${s.id}" type="button">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>
                          Remove
                        </button>
                      </span>
                    </li>`
                    )
                    .join("")}
                </ul>`
          }

          <div class="two-col">
            <form class="inline-form" id="addNewForm">
              <input id="newPersonName" placeholder="Add a new person by name" required />
              <button class="btn btn-secondary" type="submit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.25" /><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" /><line x1="18" y1="7" x2="18" y2="13" /><line x1="15" y1="10" x2="21" y2="10" /></svg>
                Add new
              </button>
            </form>
            ${
              notInClass.length > 0
                ? `<form class="inline-form" id="addExistingForm">
                    <select id="existingPick">
                      <option value="">Add existing person…</option>
                      ${notInClass.map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("")}
                    </select>
                    <button class="btn btn-secondary" type="submit">Add</button>
                  </form>`
                : ""
            }
          </div>
        </section>

        <section class="section">
          <h2>Assignments for this class</h2>
          ${
            classAssignments.length === 0
              ? `<div class="empty-state">
                  <div class="icon-badge icon-badge-muted">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2-3h14l2 3" /><path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7" /><path d="M3 7h18" /><path d="M9 7v3a3 3 0 0 0 6 0V7" /></svg>
                  </div>
                  No assignments given to this class yet.
                </div>`
              : `<ul class="assignment-list">
                  ${classAssignments
                    .map(
                      (a) => `
                    <li>
                      <a href="assignment.html?id=${encodeURIComponent(a.id)}">
                        <div class="assignment-main">
                          <div class="assignment-row">
                            <span class="assignment-title">${escapeHtml(a.title)}</span>
                            <span class="assignment-due">
                              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="8" y1="3" x2="8" y2="7" /><line x1="16" y1="3" x2="16" y2="7" /></svg>
                              Due ${escapeHtml(a.dueDate)}
                            </span>
                          </div>
                        </div>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-faint)"><path d="M9 6l6 6-6 6" /></svg>
                      </a>
                    </li>`
                    )
                    .join("")}
                </ul>`
          }
        </section>`;

      document.getElementById("backLink").addEventListener("click", () => (window.location.href = "classes.html"));

      content.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await removeStudentFromClass(btn.dataset.remove, classId);
        });
      });

      content.querySelectorAll("[data-gen-creds]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await ensureStudentCredentials(btn.dataset.genCreds, btn.dataset.genName, students);
        });
      });

      const addNewForm = document.getElementById("addNewForm");
      if (addNewForm) {
        addNewForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const input = document.getElementById("newPersonName");
          const name = input.value.trim();
          if (!name) return;
          await createStudent(name, [classId], students);
          input.value = "";
        });
      }

      const addExistingForm = document.getElementById("addExistingForm");
      if (addExistingForm) {
        addExistingForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const select = document.getElementById("existingPick");
          if (!select.value) return;
          await addStudentToClass(select.value, classId);
          select.value = "";
        });
      }
    }

    watchClasses((data) => {
      classes = data;
      render();
    });
    watchStudents((data) => {
      students = data;
      render();
    });
    watchAssignments((data) => {
      assignments = data;
      render();
    });
  </script>
</body>
</html>
